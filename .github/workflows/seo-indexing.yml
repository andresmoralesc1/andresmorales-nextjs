name: Auto SEO Indexing on GitHub Push

on:
  push:
    branches:
      - main
    paths:
      - 'app/**'
      - 'content/**'
      - 'data/**'
      - 'public/**'

jobs:
  ping-google-indexing:
    name: Notify Google Indexing API & Search Engines
    runs-on: ubuntu-latest
    steps:
      - name: Trigger SEO Webhook on Production Server
        run: |
          echo "🚀 Triggering Google Indexing API broadcast via production webhook..."
          RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}" -X POST "https://andresmorales.com.co/api/webhooks/seo-ping?secret=andresmorales_github_seo_2026")
          HTTP_BODY=$(echo "$RESPONSE" | sed -e '$d')
          HTTP_STATUS=$(echo "$RESPONSE" | tail -n 1 | cut -d':' -f2)

          echo "Response: $HTTP_BODY"
          echo "Status: $HTTP_STATUS"

          if [ "$HTTP_STATUS" -eq 200 ]; then
            echo "✅ Google Indexing API ping completed successfully!"
          else
            echo "⚠️ Webhook responded with status $HTTP_STATUS, check server logs."
          fi
