<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 260" font-family="Arial, sans-serif">
  <defs>
    <marker id="arr2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1E1810"/>
    </marker>
    <style>
      .n { fill: #fff; stroke: #1E1810; stroke-width: 1.5; }
      .lbl { font-size: 13px; font-weight: 700; fill: #1E1810; }
      .sub { font-size: 10px; fill: #575250; }
      .y { fill: #fff8e6; stroke: #f96e03; stroke-width: 1.5; }
      .ttl { font-size: 14px; font-weight: 700; fill: #f96e03; }
    </style>
  </defs>
  <text x="20" y="25" class="ttl">2 · MercadoLibre → Stripe + Google Sheet sync</text>

  <line x1="40" y1="80" x2="180" y2="80" stroke="#1E1810" stroke-width="1.5" marker-end="url(#arr2)"/>
  <line x1="280" y1="80" x2="360" y2="80" stroke="#1E1810" stroke-width="1.5" marker-end="url(#arr2)"/>
  <line x1="410" y1="80" x2="490" y2="80" stroke="#1E1810" stroke-width="1.5" marker-end="url(#arr2)"/>
  <line x1="540" y1="80" x2="620" y2="80" stroke="#1E1810" stroke-width="1.5" marker-end="url(#arr2)"/>
  <line x1="680" y1="80" x2="770" y2="80" stroke="#1E1810" stroke-width="1.5" marker-end="url(#arr2)"/>

  <g transform="translate(40,55)">
    <rect width="140" height="50" rx="6" class="n"/>
    <text x="70" y="22" text-anchor="middle" class="lbl">ML Webhook</text>
    <text x="70" y="36" text-anchor="middle" class="sub">POST /ml-orders</text>
  </g>
  <g transform="translate(220,55)">
    <rect width="160" height="50" rx="6" class="y"/>
    <text x="80" y="22" text-anchor="middle" class="lbl">If paid?</text>
    <text x="80" y="36" text-anchor="middle" class="sub">status == "paid"</text>
  </g>
  <g transform="translate(390,55)">
    <rect width="150" height="50" rx="6" class="n"/>
    <text x="75" y="22" text-anchor="middle" class="lbl">Stripe</text>
    <text x="75" y="36" text-anchor="middle" class="sub">create checkout session</text>
  </g>
  <g transform="translate(540,55)">
    <rect width="140" height="50" rx="6" class="n"/>
    <text x="70" y="22" text-anchor="middle" class="lbl">GSheet</text>
    <text x="70" y="36" text-anchor="middle" class="sub">append row audit</text>
  </g>
  <g transform="translate(680,55)">
    <rect width="160" height="50" rx="6" class="n"/>
    <text x="80" y="22" text-anchor="middle" class="lbl">Telegram alert</text>
    <text x="80" y="36" text-anchor="middle" class="sub">notify on error</text>
  </g>

  <text x="450" y="170" text-anchor="middle" class="sub" font-style="italic">target: 5 min from ML paid → Stripe session + audit row</text>
  <text x="20" y="220" class="lbl">Data flow:</text>
  <text x="20" y="238" class="sub">order.id, items[].title, items[].quantity, total_amount → Stripe line_items → GSheet audit row → Telegram on error</text>
</svg>
