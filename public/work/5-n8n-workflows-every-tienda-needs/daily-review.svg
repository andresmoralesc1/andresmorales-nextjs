<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 260" font-family="Arial, sans-serif">
  <defs>
    <marker id="arr4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1E1810"/>
    </marker>
    <style>
      .n { fill: #fff; stroke: #1E1810; stroke-width: 1.5; }
      .lbl { font-size: 13px; font-weight: 700; fill: #1E1810; }
      .sub { font-size: 10px; fill: #575250; }
      .pmpt { fill: #fffbe6; stroke: #f96e03; stroke-width: 1.5; stroke-dasharray: 3,2; }
      .ttl { font-size: 14px; font-weight: 700; fill: #f96e03; }
    </style>
  </defs>
  <text x="20" y="25" class="ttl">4 · Daily business review → Telegram (8 a.m. GMT-5)</text>

  <line x1="60" y1="80" x2="170" y2="80" stroke="#1E1810" stroke-width="1.5" marker-end="url(#arr4)"/>
  <line x1="250" y1="80" x2="370" y2="80" stroke="#1E1810" stroke-width="1.5" marker-end="url(#arr4)"/>
  <line x1="450" y1="80" x2="570" y2="80" stroke="#1E1810" stroke-width="1.5" marker-end="url(#arr4)"/>
  <line x1="650" y1="80" x2="770" y2="80" stroke="#1E1810" stroke-width="1.5" marker-end="url(#arr4)"/>

  <g transform="translate(50,50)">
    <rect width="120" height="60" rx="6" class="n"/>
    <text x="60" y="25" text-anchor="middle" class="lbl">Cron</text>
    <text x="60" y="40" text-anchor="middle" class="sub">0 13 * * *</text>
  </g>
  <g transform="translate(190,50)">
    <rect width="140" height="60" rx="6" class="n"/>
    <text x="70" y="22" text-anchor="middle" class="lbl">Stripe</text>
    <text x="70" y="40" text-anchor="middle" class="sub">yesterday / 7d / 30d</text>
  </g>
  <g transform="translate(390,50)">
    <rect width="140" height="60" rx="6" class="n"/>
    <text x="70" y="22" text-anchor="middle" class="lbl">Shopify</text>
    <text x="70" y="40" text-anchor="middle" class="sub">orders + top SKUs</text>
  </g>
  <g transform="translate(590,50)">
    <rect width="140" height="60" rx="6" class="n"/>
    <text x="70" y="22" text-anchor="middle" class="lbl">Sheets</text>
    <text x="70" y="40" text-anchor="middle" class="sub">pipeline</text>
  </g>
  <g transform="translate(770,35)">
    <rect width="100" height="90" rx="6" class="pmpt"/>
    <text x="50" y="25" text-anchor="middle" class="lbl">LLM</text>
    <text x="50" y="40" text-anchor="middle" class="sub">4 sections:</text>
    <text x="50" y="54" text-anchor="middle" class="sub">Revenue</text>
    <text x="50" y="67" text-anchor="middle" class="sub">Pipeline</text>
    <text x="50" y="80" text-anchor="middle" class="sub">Ops · Today</text>
  </g>
  <line x1="730" y1="80" x2="770" y2="80" stroke="#1E1810" stroke-width="1.5" marker-end="url(#arr4)"/>

  <g transform="translate(50,180)">
    <text class="lbl">Prompt:</text>
    <text x="0" y="22" class="sub" font-style="italic">"You are a business analyst. The owner reads a 3-minute review. Output exactly 4</text>
    <text x="0" y="36" class="sub" font-style="italic">sections: Revenue (today / 7d / 30d + 1 anomaly), Pipeline (new / qualified / closed),</text>
    <text x="0" y="50" class="sub" font-style="italic">Ops (open orders, fulfillment errors, support backlog), One thing today. Use exact format."</text>
  </g>
</svg>
