<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" font-family="Arial, sans-serif">
  <defs>
    <marker id="arr3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1E1810"/>
    </marker>
    <style>
      .n { fill: #fff; stroke: #1E1810; stroke-width: 1.5; }
      .lbl { font-size: 13px; font-weight: 700; fill: #1E1810; }
      .sub { font-size: 10px; fill: #575250; }
      .y { fill: #fff8e6; stroke: #f96e03; stroke-width: 1.5; }
      .b { fill: #e6f4ff; stroke: #1E1810; stroke-width: 1.5; }
      .g { fill: #e6ffe6; stroke: #1E1810; stroke-width: 1.5; }
      .ttl { font-size: 14px; font-weight: 700; fill: #f96e03; }
      .pmpt { fill: #fffbe6; stroke: #f96e03; stroke-width: 1.5; stroke-dasharray: 3,2; }
    </style>
  </defs>
  <text x="20" y="25" class="ttl">3 · Email triage via Gmail + Telegram (LLM classifier)</text>

  <line x1="40" y1="100" x2="170" y2="100" stroke="#1E1810" stroke-width="1.5" marker-end="url(#arr3)"/>
  <line x1="290" y1="100" x2="380" y2="100" stroke="#1E1810" stroke-width="1.5" marker-end="url(#arr3)"/>
  <line x1="430" y1="100" x2="540" y2="100" stroke="#1E1810" stroke-width="1.5" marker-end="url(#arr3)"/>

  <g transform="translate(40,50)">
    <rect width="130" height="100" rx="6" class="n"/>
    <text x="65" y="25" text-anchor="middle" class="lbl">Gmail Push</text>
    <text x="65" y="48" text-anchor="middle" class="sub">trigger on</text>
    <text x="65" y="62" text-anchor="middle" class="sub">new email</text>
    <text x="65" y="84" text-anchor="middle" class="sub">→ fetch body + headers</text>
  </g>
  <g transform="translate(210,50)">
    <rect width="160" height="100" rx="6" class="pmpt"/>
    <text x="80" y="25" text-anchor="middle" class="lbl">LLM Classifier</text>
    <text x="80" y="48" text-anchor="middle" class="sub">urgent / important /</text>
    <text x="65" y="62" text-anchor="middle" class="sub">newsletter / transactional / spam</text>
    <text x="80" y="84" text-anchor="middle" class="sub" font-style="italic">→ returns label only</text>
  </g>
  <g transform="translate(430,30)">
    <rect width="180" height="60" rx="6" class="b"/>
    <text x="90" y="22" text-anchor="middle" class="lbl">If urgent / important</text>
    <text x="90" y="40" text-anchor="middle" class="sub">→ forward to Telegram +</text>
    <text x="90" y="55" text-anchor="middle" class="sub">tag Gmail "needs-me"</text>
  </g>
  <g transform="translate(430,100)">
    <rect width="180" height="60" rx="6" class="g"/>
    <text x="90" y="22" text-anchor="middle" class="lbl">Else</text>
    <text x="90" y="40" text-anchor="middle" class="sub">→ tag Gmail "info"</text>
    <text x="90" y="55" text-anchor="middle" class="sub">stop (no human alert)</text>
  </g>

  <text x="20" y="195" class="lbl">Prompt:</text>
  <text x="20" y="215" class="sub" font-style="italic">"Classify the email into one of: urgent-needs-reply, important-needs-decision,</text>
  <text x="20" y="229" class="sub" font-style="italic">newsletter, transactional, spam. Reply with ONLY the label."</text>

  <text x="20" y="260" class="lbl">Real-world result:</text>
  <text x="20" y="280" class="sub">≈ 90% accuracy on the 4-way classification after a week of tuning.</text>
  <text x="20" y="294" class="sub">The 10% the bot misses are the ones the owner would open anyway.</text>
</svg>
