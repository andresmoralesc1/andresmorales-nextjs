<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 240" font-family="Arial, sans-serif">
  <defs>
    <marker id="arr6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1E1810"/>
    </marker>
    <style>
      .n { fill: #fff; stroke: #1E1810; stroke-width: 1.5; }
      .lbl { font-size: 13px; font-weight: 700; fill: #1E1810; }
      .sub { font-size: 10px; fill: #575250; }
      .y { fill: #fff8e6; stroke: #f96e03; stroke-width: 1.5; }
      .b { fill: #e6f4ff; stroke: #1E1810; stroke-width: 1.5; }
      .w { fill: #ffe6e6; stroke: #c33; stroke-width: 1.5; }
      .g { fill: #e6ffe6; stroke: #1E1810; stroke-width: 1.5; }
      .ttl { font-size: 14px; font-weight: 700; fill: #f96e03; }
    </style>
  </defs>
  <text x="20" y="25" class="ttl">3-3-3 Responder — WhatsApp → catalog lookup → reply or escalate</text>

  <line x1="40" y1="80" x2="170" y2="80" stroke="#1E1810" stroke-width="1.5" marker-end="url(#arr6)"/>
  <line x1="280" y1="80" x2="370" y2="80" stroke="#1E1810" stroke-width="1.5" marker-end="url(#arr6)"/>
  <line x1="450" y1="80" x2="560" y2="80" stroke="#1E1810" stroke-width="1.5" marker-end="url(#arr6)"/>
  <line x1="660" y1="80" x2="770" y2="80" stroke="#1E1810" stroke-width="1.5" marker-end="url(#arr6)"/>
  <line x1="570" y1="135" x2="660" y2="90" stroke="#1E1810" stroke-width="1.5" marker-end="url(#arr6)"/>

  <g transform="translate(40,50)">
    <rect width="130" height="60" rx="6" class="b"/>
    <text x="65" y="22" text-anchor="middle" class="lbl">WA Webhook</text>
    <text x="65" y="40" text-anchor="middle" class="sub">incoming message</text>
  </g>
  <g transform="translate(210,50)">
    <rect width="160" height="60" rx="6" class="n"/>
    <text x="80" y="22" text-anchor="middle" class="lbl">Code: Classify</text>
    <text x="80" y="40" text-anchor="middle" class="sub">lookup catalog + intent</text>
  </g>
  <g transform="translate(390,50)">
    <rect width="160" height="60" rx="6" class="y"/>
    <text x="80" y="22" text-anchor="middle" class="lbl">If: auto_answer?</text>
    <text x="80" y="40" text-anchor="middle" class="sub">true / false</text>
  </g>
  <g transform="translate(580,30)">
    <rect width="190" height="60" rx="6" class="g"/>
    <text x="95" y="22" text-anchor="middle" class="lbl">Yes → WA Send</text>
    <text x="95" y="40" text-anchor="middle" class="sub">reply with template</text>
  </g>
  <g transform="translate(770,110)">
    <rect width="110" height="60" rx="6" class="w"/>
    <text x="55" y="22" text-anchor="middle" class="lbl">No →</text>
    <text x="55" y="40" text-anchor="middle" class="lbl">Telegram</text>
  </g>
  <g transform="translate(580,110)">
    <rect width="160" height="60" rx="6" class="n"/>
    <text x="80" y="22" text-anchor="middle" class="lbl">Log to ops</text>
    <text x="80" y="40" text-anchor="middle" class="sub">ping for review</text>
  </g>

  <text x="20" y="200" class="lbl">3-3-3: < 3 s ack · < 3 m first reply · < 3 m route</text>
  <text x="20" y="220" class="sub">First 100 messages calibrate the prompt; week 2 is steady state.</text>
</svg>
